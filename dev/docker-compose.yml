services:
  redis:
    image: redis:8.12.0-alpine3.23
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-secret} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data: